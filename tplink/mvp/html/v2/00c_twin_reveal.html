<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>分身诞生 · SoulMatch</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
body {
  width:390px; height:844px; overflow:hidden;
  font-family:-apple-system,'PingFang SC',sans-serif;
  background:linear-gradient(180deg, #3d2670 0%, #6b3d8f 35%, #c084d9 75%, #fbcfe8 100%);
  color:#fff; display:flex; flex-direction:column;
}
.status-bar {
  height:54px; display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 0; flex-shrink:0;
}
.status-time { font-size:15px; font-weight:600; color:#fff; }
.status-icons svg { color:#fff; }

.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; }
.bokeh span {
  position:absolute; border-radius:50%; filter:blur(1px); opacity:.55; animation:dr 8s ease-in-out infinite;
}
@keyframes dr { 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(10px,-8px);} }
.bokeh span:nth-child(1){ width:40px; height:40px; left:12%; top:22%; background:#5eead4; }
.bokeh span:nth-child(2){ width:56px; height:56px; right:10%; top:28%; background:#f9a8d4; animation-delay:1s; }
.bokeh span:nth-child(3){ width:32px; height:32px; left:20%; bottom:30%; background:#fde047; animation-delay:2s; }
.bokeh span:nth-child(4){ width:48px; height:48px; right:18%; bottom:25%; background:#67e8f9; animation-delay:.5s; }

h1 { font-size:24px; font-weight:800; text-align:center; letter-spacing:-0.3px; z-index:2; text-shadow:0 2px 20px rgba(0,0,0,.2); }
.desc {
  margin-top:14px; font-size:14px; line-height:1.65; text-align:center;
  color:rgba(255,255,255,.92); max-width:300px; z-index:2;
  text-shadow:0 1px 12px rgba(0,0,0,.15);
}

.creature-wrap {
  margin:32px 0 28px; z-index:2;
  position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center;
}
.aura {
  position:absolute; inset:-20px;
  background:radial-gradient(circle, rgba(255,182,213,.7) 0%, rgba(255,255,255,.4) 45%, transparent 70%);
  border-radius:50%; animation:pu 2.5s ease-in-out infinite;
}
@keyframes pu { 0%,100%{ transform:scale(1); opacity:.9; } 50%{ transform:scale(1.08); opacity:1; } }

.creature {
  width:120px; height:118px;
  background:radial-gradient(ellipse at 35% 28%, rgba(255,255,255,.85) 0%, transparent 42%),
    radial-gradient(circle at 50% 100%, #7dd3fc 0%, #38bdf8 45%, #0ea5e9 100%);
  border-radius:48% 48% 46% 46% / 52% 52% 48% 48%;
  box-shadow:
    inset 4px 6px 14px rgba(255,255,255,.55),
    inset -6px -10px 20px rgba(14,116,180,.35),
    0 16px 40px rgba(14,116,180,.25);
  position:relative;
  animation:cr 4s ease-in-out infinite;
}
@keyframes cr { 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-6px) scale(1.02); } }
.creature::before, .creature::after {
  content:''; position:absolute; width:14px; height:18px;
  background:#0f172a; border-radius:50%; top:38px;
}
.creature::before { left:32px; }
.creature::after { right:32px; }
.creature-blush {
  position:absolute; width:18px; height:8px; border-radius:50%;
  background:rgba(255,150,180,.45); top:52px; filter:blur(2px);
}
.creature-blush.l { left:22px; }
.creature-blush.r { right:22px; }

.horizon {
  position:absolute; bottom:180px; left:0; right:0; height:3px;
  background:linear-gradient(90deg, transparent, rgba(30,10,50,.35), transparent);
  z-index:1;
}

.btn-wrap { width:100%; max-width:320px; z-index:2; padding-bottom:28px; }
.btn-primary {
  width:100%; padding:16px; border:none; border-radius:16px;
  background:#fff; color:#5b21b6; font-size:17px; font-weight:700; font-family:inherit;
  cursor:pointer; box-shadow:0 10px 40px rgba(0,0,0,.15);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:active { transform:scale(.98); }
.skip {
  display:block; text-align:center; margin-top:14px; font-size:14px; color:rgba(255,255,255,.75);
  text-decoration:none;
}
</style>
</head>
<body>
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg>
    <svg width="16" height="12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.4C13.2 1.5 10.7 0.5 8 0.5C5.3 0.5 2.8 1.5 1 3.4L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#fff"/><path d="M8 5.5C9.4 5.5 10.7 6.1 11.6 7.1L13 5.6C11.7 4.2 9.9 3.5 8 3.5C6.1 3.5 4.3 4.2 3 5.6L4.4 7.1C5.3 6.1 6.6 5.5 8 5.5Z" fill="#fff"/><circle cx="8" cy="10" r="1.5" fill="#fff"/></svg>
    <svg width="25" height="12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/></svg>
  </div>
</div>

<div class="content">
  <div class="bokeh"><span></span><span></span><span></span><span></span></div>
  <div class="horizon"></div>
  <h1>你的分身醒来了</h1>
  <p class="desc">Ta 会陪你走完灵魂问卷、记住你的表达习惯，并在匹配与聊天里悄悄帮你。接下来花 3 分钟，让 Ta 更懂你。</p>

  <div class="creature-wrap">
    <div class="aura"></div>
    <div class="creature">
      <span class="creature-blush l"></span>
      <span class="creature-blush r"></span>
    </div>
  </div>

  <div class="btn-wrap">
    <button type="button" class="btn-primary" id="start">
      开始灵魂问卷
      <i data-lucide="arrow-right" style="width:20px;height:20px"></i>
    </button>
    <a class="skip" href="02_profile.html">稍后补充，先看看档案 demo</a>
  </div>
</div>

<script>
document.getElementById('start').addEventListener('click', function() {
  window.location.href = '01_questionnaire.html';
});
if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
</body>
</html>
