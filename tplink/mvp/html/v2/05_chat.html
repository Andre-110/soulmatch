<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>AI聊天辅助 · SoulMatch</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
body { width:390px; height:844px; overflow:hidden; font-family:-apple-system,'PingFang SC',sans-serif; background:linear-gradient(165deg,#2d1b4e 0%,#12081f 55%,#0a0510 100%); display:flex; flex-direction:column; }
.status-bar { height:54px; background:transparent; display:flex; align-items:center; justify-content:space-between; padding:14px 20px 0; flex-shrink:0; border-bottom:0.5px solid rgba(255,255,255,.1); }
.status-time { font-size:15px; font-weight:600; color:#fff; }
.status-icons { display:flex; align-items:center; gap:6px; }
.status-icons svg { color:#fff; }
.nav-bar { height:52px; background:rgba(255,255,255,.04); display:flex; align-items:center; justify-content:space-between; padding:0 12px; flex-shrink:0; border-bottom:0.5px solid rgba(255,255,255,.1); }
.nav-back { display:flex; align-items:center; gap:2px; color:#c4b5fd; font-size:16px; min-width:60px; }
.nav-back path { stroke:#c4b5fd!important; }
.nav-center { display:flex; align-items:center; gap:8px; }
.nav-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#6C5CE7); color:#fff; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.nav-info { display:flex; flex-direction:column; align-items:center; }
.nav-name { font-size:16px; font-weight:600; color:#f5f0ff; line-height:1.3; }
.nav-online { display:flex; align-items:center; gap:4px; font-size:11px; color:rgba(245,240,255,.45); }
.online-dot { width:6px; height:6px; border-radius:50%; background:#34d399; }
.ai-banner { background:rgba(196,181,253,.12); padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; border-bottom:1px solid rgba(196,181,253,.2); }
.ai-banner-text { flex:1; font-size:12px; color:#c4b5fd; line-height:1.4; }
.ai-expand { font-size:12px; color:#ffe066; font-weight:600; white-space:nowrap; }
.ai-banner svg { stroke:#c4b5fd!important; }
.chat-area { flex:1; overflow-y:auto; padding:12px 16px; background:transparent; }
.chat-area::-webkit-scrollbar { display:none; }
.time-divider { text-align:center; font-size:12px; color:rgba(245,240,255,.4); margin:8px 0 14px; }
.msg-row { display:flex; align-items:flex-end; gap:8px; margin-bottom:12px; }
.msg-row.sent { flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#6C5CE7); color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.bubble { max-width:240px; padding:10px 14px; border-radius:18px; font-size:15px; line-height:1.5; }
.bubble.received { background:rgba(255,255,255,.1); color:#f5f0ff; border:1px solid rgba(255,255,255,.12); border-bottom-left-radius:4px; }
.bubble.sent { background:linear-gradient(135deg,#7c3aed,#6C5CE7); color:#fff; border-bottom-right-radius:4px; }
.ai-suggestion { background:rgba(196,181,253,.1); border:1px solid rgba(196,181,253,.3); border-radius:12px; padding:10px 12px; margin:8px 40px 12px; }
.ai-sugg-header { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.ai-badge { background:#6C5CE7; color:#fff; font-size:10px; font-weight:600; padding:2px 7px; border-radius:10px; }
.ai-sugg-text { font-size:13px; color:rgba(245,240,255,.85); line-height:1.5; margin-bottom:8px; }
.ai-adopt-btn { background:linear-gradient(135deg,#8b5cf6,#6C5CE7); color:#fff; border:none; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; }
.input-bar { background:rgba(10,5,20,.9); border-top:0.5px solid rgba(255,255,255,.1); padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.input-field { flex:1; background:rgba(255,255,255,.08); border:none; border-radius:20px; padding:9px 14px; font-size:15px; color:#f5f0ff; outline:none; font-family:inherit; }
.send-btn { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#6C5CE7); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tab-bar { height:83px; background:rgba(10,5,20,.88); border-top:0.5px solid rgba(255,255,255,.1); display:flex; align-items:flex-start; padding-top:10px; flex-shrink:0; }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:rgba(245,240,255,.42); }
.tab-item.active { color:#ffe066; }
.tab-item.active svg { stroke:#ffe066; }
.tab-item svg { stroke:currentColor; }
</style>
</head>

</div>
<div class="ai-banner">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3" stroke-linecap="round"/></svg>
