# 将域名 HTTPS 反代到本仓库「生产启动」端口（见 package.json: next start -p 3010）
# 用法：复制到 /etc/nginx/sites-available/，把 server_name、证书路径改成你的，
#       ln -s 到 sites-enabled，nginx -t && systemctl reload nginx
#
# 若仍 502：在服务器上执行
#   curl -sS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3010/api/health/live
# 若不是 200，说明 Next 未监听 3010（进程没起、或用了别的 PORT）。

upstream soulmatch_next {
    server 127.0.0.1:3010;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soulmatch.aibasis.com;   # 改成你的域名

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://soulmatch_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # 长耗时 API：关闭缓冲 + 拉长超时（与 app/api/analyze 的流式响应配合）
    location /api/analyze {
        proxy_pass http://soulmatch_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
        proxy_cache off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name soulmatch.aibasis.com;
    return 301 https://$host$request_uri;
}
