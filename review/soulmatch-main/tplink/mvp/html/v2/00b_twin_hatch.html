<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>唤醒分身 · SoulMatch</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
body {
  width:390px; height:844px; overflow:hidden;
  font-family:-apple-system,'PingFang SC',sans-serif;
  background:radial-gradient(circle at 50% 35%, #5c3d9e 0%, #2d1b4e 42%, #12081f 100%);
  color:#fff; display:flex; flex-direction:column; align-items:center;
}
.status-bar {
  width:100%; height:54px; display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 0;
}
.status-time { font-size:15px; font-weight:600; }
.status-icons { display:flex; gap:6px; }
.status-icons svg { color:#fff; }

.title { margin-top:28px; font-size:22px; font-weight:700; text-align:center; letter-spacing:-0.3px; }
.sub { margin-top:8px; font-size:13px; color:rgba(255,255,255,.6); text-align:center; padding:0 36px; line-height:1.5; }

.sun-glow {
  position:absolute; top:200px; left:50%; transform:translate(-50%,-50%);
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,200,80,.75) 0%, rgba(255,140,60,.35) 35%, transparent 70%);
  pointer-events:none; z-index:0;
}
.stage { flex:1; width:100%; position:relative; display:flex; align-items:center; justify-content:center; z-index:1; }
.sparkles { position:absolute; inset:0; pointer-events:none; }
.s-dot {
  position:absolute; width:5px; height:5px; border-radius:50%; background:#FFE066;
  box-shadow:0 0 10px #FFE066; animation:fl 1.8s ease-in-out infinite;
}
@keyframes fl { 0%,100%{opacity:.3; transform:translateY(0);} 50%{opacity:1; transform:translateY(-6px);} }

.egg-float {
  width:124px; height:156px;
  border-radius:50% 50% 48% 48% / 58% 58% 42% 42%;
  background:
    radial-gradient(ellipse 80% 70% at 40% 22%, rgba(255,255,255,.5) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, #1a3d5c 0%, #4a9fd4 40%, #7dd3fc 100%);
  box-shadow:inset -6px -10px 20px rgba(0,0,0,.2), 0 20px 50px rgba(0,0,0,.35);
  animation:bob 3s ease-in-out infinite;
  z-index:2;
}
@keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

.hold-area {
  position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px; z-index:3;
  user-select:none; touch-action:none;
}
.ring-wrap {
  width:88px; height:88px; position:relative; display:flex; align-items:center; justify-content:center;
}
.ring-bg {
  position:absolute; inset:0; border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
}
.ring-progress {
  position:absolute; inset:0; border-radius:50%;
  border:3px solid transparent;
  border-top-color:#FFE066;
  border-right-color:#FFE066;
  transform:rotate(-90deg);
  transition:transform .05s linear;
  clip-path:inset(0 0 0 0);
}
.hold-area.active .ring-progress { animation:none; }
.fp-btn {
  width:72px; height:72px; border-radius:50%;
  background:rgba(255,255,255,.95); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:#4c1d95; box-shadow:0 8px 28px rgba(255,224,102,.35);
  transition:transform .15s, box-shadow .15s;
}
.hold-area.pressed .fp-btn {
  transform:scale(.94);
  box-shadow:0 4px 16px rgba(255,224,102,.5);
}
.hold-label { font-size:13px; color:rgba(255,255,255,.75); }
.hold-sec { font-size:12px; color:#FFE066; font-weight:700; font-variant-numeric:tabular-nums; }

.done-overlay {
  position:fixed; inset:0; background:rgba(10,5,20,.4);
  display:none; align-items:center; justify-content:center; z-index:20;
}
.done-overlay.show { display:flex; }
.done-card {
  background:linear-gradient(160deg, rgba(255,255,255,.15), rgba(40,20,70,.9));
  backdrop-filter:blur(16px); border-radius:20px; padding:24px 28px; text-align:center;
  border:1px solid rgba(255,255,255,.2);
}
.done-card p { font-size:15px; margin-bottom:16px; line-height:1.5; }
.done-card button {
  padding:12px 24px; border-radius:14px; border:none; background:#FFE066; color:#3d2b00;
  font-weight:700; font-size:15px; cursor:pointer; font-family:inherit;
}
</style>
</head>
<body>
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.4C13.2 1.5 10.7 0.5 8 0.5C5.3 0.5 2.8 1.5 1 3.4L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="#fff"/><path d="M8 5.5C9.4 5.5 10.7 6.1 11.6 7.1L13 5.6C11.7 4.2 9.9 3.5 8 3.5C6.1 3.5 4.3 4.2 3 5.6L4.4 7.1C5.3 6.1 6.6 5.5 8 5.5Z" fill="#fff"/><circle cx="8" cy="10" r="1.5" fill="#fff"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6 24.5 5.5 23.8 4.8 23 4.5Z" fill="#fff" opacity=".45"/></svg>
  </div>
</div>
<h1 class="title">正在唤醒你的分身…</h1>
<p class="sub">长按下方指纹 3 秒，用触感完成「灵魂契约」。松开会重新开始。</p>

<div class="sun-glow"></div>
<div class="stage">
  <div class="sparkles">
    <span class="s-dot" style="left:18%;top:38%"></span>
    <span class="s-dot" style="right:15%;top:42%;animation-delay:.2s"></span>
    <span class="s-dot" style="left:40%;top:30%;animation-delay:.5s"></span>
    <span class="s-dot" style="right:28%;top:28%;animation-delay:.8s"></span>
  </div>
  <div class="egg-float" id="egg"></div>
</div>

<div class="hold-area" id="hold">
  <div class="ring-wrap">
    <div class="ring-bg"></div>
    <div class="ring-progress" id="ring" style="transform:rotate(-90deg)"></div>
    <button type="button" class="fp-btn" id="fp" aria-label="长按唤醒">
      <i data-lucide="fingerprint" style="width:36px;height:36px"></i>
    </button>
  </div>
  <span class="hold-label">长按指纹继续</span>
  <span class="hold-sec" id="count">3</span>
</div>

<div class="done-overlay" id="done">
  <div class="done-card">
    <p>能量已满，分身即将破壳。</p>
    <button type="button" id="continue">去见Ta</button>
  </div>
</div>

<script>
(function() {
  var hold = document.getElementById('hold');
  var ring = document.getElementById('ring');
  var countEl = document.getElementById('count');
  var done = document.getElementById('done');
  var dur = 3000;
  var start = null;
  var raf = null;
  function setProgress(p) {
    var deg = -90 + p * 360;
    ring.style.transform = 'rotate(' + deg + 'deg)';
    var left = Math.ceil((1 - p) * 3);
    if (left < 1) left = 0;
    countEl.textContent = left === 0 ? '' : String(left);
  }
  function loop(t) {
    if (!start) return;
    var elapsed = t - start;
    var p = Math.min(1, elapsed / dur);
    setProgress(p);
    if (p >= 1) {
      cancelAnimationFrame(raf);
      raf = null;
      start = null;
      hold.classList.remove('pressed', 'active');
      done.classList.add('show');
      return;
    }
    raf = requestAnimationFrame(loop);
  }
  function pressStart(e) {
    e.preventDefault();
    if (done.classList.contains('show')) return;
    start = performance.now();
    hold.classList.add('pressed', 'active');
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function pressEnd(e) {
    e.preventDefault();
    if (!start) return;
    var elapsed = performance.now() - start;
    if (elapsed < dur) {
      start = null;
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      setProgress(0);
      countEl.textContent = '3';
    }
    hold.classList.remove('pressed');
  }
  var fp = document.getElementById('fp');
  fp.addEventListener('pointerdown', pressStart);
  fp.addEventListener('pointerup', pressEnd);
  fp.addEventListener('pointerleave', pressEnd);
  fp.addEventListener('pointercancel', pressEnd);
  document.getElementById('continue').addEventListener('click', function() {
    window.location.href = '00c_twin_reveal.html';
  });
  setProgress(0);
  if (typeof lucide !== 'undefined') lucide.createIcons();
})();
</script>
</body>
</html>
