<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>灵魂问卷 · SoulMatch</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: #F2F2F7;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* STATUS BAR */
  .status-bar {
    width: 390px;
    height: 54px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 0 20px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .status-time {
    font-size: 15px;
    font-weight: 600;
    color: #000;
    letter-spacing: -0.3px;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-icons svg {
    color: #000;
  }

  /* NAV BAR */
  .nav-bar {
    background: #FFFFFF;
    padding: 8px 20px 12px 20px;
    border-bottom: 0.5px solid rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .nav-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .nav-back {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #6C5CE7;
    font-size: 17px;
    cursor: pointer;
  }
  .nav-title {
    font-size: 34px;
    font-weight: 700;
    color: #1C1C1E;
    letter-spacing: -0.5px;
  }
  .ai-hint {
    font-size: 12px;
    color: #6C5CE7;
    background: rgba(108,92,231,0.08);
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
  }
  .ai-dot {
    width: 6px;
    height: 6px;
    background: #6C5CE7;
    border-radius: 50%;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* PROGRESS */
  .progress-section {
    background: #FFFFFF;
    padding: 14px 20px 16px 20px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .progress-step {
    font-size: 13px;
    font-weight: 600;
    color: #6C5CE7;
  }
  .progress-pct {
    font-size: 13px;
    color: #8E8E93;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: #E5E5EA;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #6C5CE7, #a29bfe);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* SCROLL CONTENT */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 0 20px;
    -webkit-overflow-scrolling: touch;
  }
  .scroll-content::-webkit-scrollbar { display: none; }

  /* QUESTION BLOCK */
  .question-block {
    margin-bottom: 24px;
  }
  .question-label {
    font-size: 11px;
    font-weight: 600;
    color: #6C5CE7;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 18px;
    font-weight: 700;
    color: #1C1C1E;
    line-height: 1.4;
    margin-bottom: 14px;
  }

  /* OPTION CARDS */
  .option-card {
    width: 100%;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .option-card.selected {
    border-color: #6C5CE7;
    background: rgba(108,92,231,0.06);
    box-shadow: 0 2px 12px rgba(108,92,231,0.15);
  }
  .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: #F2F2F7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #8E8E93;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }
  .option-card.selected .option-letter {
    background: #6C5CE7;
    color: #FFFFFF;
  }
  .option-text {
    font-size: 15px;
    color: #1C1C1E;
    line-height: 1.5;
    flex: 1;
  }
  .option-card.selected .option-text {
    color: #6C5CE7;
    font-weight: 500;
  }
  .option-check {
    width: 20px;
    height: 20px;
    margin-top: 3px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .option-card.selected .option-check {
    opacity: 1;
    color: #6C5CE7;
  }

  /* BOTTOM BAR */
  .bottom-bar {
    background: #FFFFFF;
    padding: 12px 20px 34px 20px;
    border-top: 0.5px solid rgba(0,0,0,0.1);
    flex-shrink: 0;
  }
  .btn-next {
    width: 100%;
    height: 52px;
    background: #6C5CE7;
    border: none;
    border-radius: 16px;
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(108,92,231,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.2px;
  }
  .btn-next:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(108,92,231,0.25);
  }
  .bottom-hint {
    text-align: center;
    font-size: 13px;
    color: #8E8E93;
    margin-top: 10px;
  }
  .bottom-hint span {
    color: #6C5CE7;
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- STATUS BAR -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div class="status-icons">
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
      <rect x="0" y="3" width="3" height="9" rx="1" fill="black"/>
      <rect x="4.5" y="2" width="3" height="10" rx="1" fill="black"/>
      <rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="black"/>
      <rect x="13.5" y="0" width="3" height="12" rx="1" fill="black" opacity="0.3"/>
    </svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
      <path d="M8 2.5C10.2 2.5 12.2 3.4 13.6 4.9L15 3.4C13.2 1.5 10.7 0.5 8 0.5C5.3 0.5 2.8 1.5 1 3.4L2.4 4.9C3.8 3.4 5.8 2.5 8 2.5Z" fill="black"/>
      <path d="M8 5.5C9.4 5.5 10.7 6.1 11.6 7.1L13 5.6C11.7 4.2 9.9 3.5 8 3.5C6.1 3.5 4.3 4.2 3 5.6L4.4 7.1C5.3 6.1 6.6 5.5 8 5.5Z" fill="black"/>
      <circle cx="8" cy="10" r="1.5" fill="black"/>
    </svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
      <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="black" stroke-opacity="0.35"/>
      <rect x="2" y="2" width="16" height="8" rx="2" fill="black"/>
      <path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6C24.5 5.5 23.8 4.8 23 4.5Z" fill="black" opacity="0.4"/>
    </svg>
  </div>
</div>

<!-- NAV BAR -->
<div class="nav-bar">
  <div class="nav-top">
    <div class="nav-back">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 1L1 8L9 15"/>
      </svg>
      <span style="font-size:17px;">返回</span>
    </div>
    <span style="font-size:15px;color:#8E8E93;">2 / 5</span>
  </div>
  <div class="nav-title">灵魂问卷</div>
  <div class="ai-hint">
    <span class="ai-dot"></span>
    AI正在分析你的性格特征...
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-section">
  <div class="progress-label">
    <span class="progress-step">第2步 · 你的三观</span>
    <span class="progress-pct">40%</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill"></div>
  </div>
</div>

<!-- SCROLL CONTENT -->
<div class="scroll-content">

  <!-- QUESTION 1 -->
  <div class="question-block">
    <div class="question-label">问题 1 / 2</div>
    <div class="question-text">面对冲突，你更倾向于？</div>

    <div class="option-card selected" onclick="selectOption(this, 'q1')">
      <div class="option-letter">A</div>
      <div class="option-text">直接说出来，解决问题更重要</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card" onclick="selectOption(this, 'q1')">
      <div class="option-letter">B</div>
      <div class="option-text">先冷静，等情绪平复再谈</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card" onclick="selectOption(this, 'q1')">
      <div class="option-letter">C</div>
      <div class="option-text">顺着对方，保持和平</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card" onclick="selectOption(this, 'q1')">
      <div class="option-letter">D</div>
      <div class="option-text">视情况而定，灵活处理</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
  </div>

  <!-- QUESTION 2 -->
  <div class="question-block">
    <div class="question-label">问题 2 / 2</div>
    <div class="question-text">你理想的周末是？</div>

    <div class="option-card" onclick="selectOption(this, 'q2')">
      <div class="option-letter">A</div>
      <div class="option-text">和朋友出去玩，越热闹越好</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card selected" onclick="selectOption(this, 'q2')">
      <div class="option-letter">B</div>
      <div class="option-text">宅在家看剧 / 打游戏 / 看书</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card" onclick="selectOption(this, 'q2')">
      <div class="option-letter">C</div>
      <div class="option-text">一个人去探索新地方</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="option-card" onclick="selectOption(this, 'q2')">
      <div class="option-letter">D</div>
      <div class="option-text">半社交半独处，保持平衡</div>
      <svg class="option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
  </div>

  <div style="height:20px"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn-next">
    下一题
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
  <div class="bottom-hint">已完成 <span>8 / 20</span> 题</div>
</div>

<script>
function selectOption(el, group) {
  const parent = el.closest('.question-block');
  parent.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}
</script>

</body>
</html>
